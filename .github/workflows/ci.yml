name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version` here: `package.json` pins `packageManager`, and this
      # action reads it. Naming a version in both places is an error — the
      # action refuses rather than picking one — so the manifest is the single
      # source, and CI installs exactly what a developer does.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # The deploy package ships a data archive that is fetched, not committed:
      # it is a snapshot of a public provider repository, and committing it
      # would carry thousands of files nobody edits. `build:bundle` copies it
      # into `lib/data/`, so a clean checkout has nothing to copy and the build
      # stops with "Run `pnpm run fetch-examples`".
      #
      # Fetching here rather than stubbing the file keeps the check honest: CI
      # then proves the published tarball can actually be assembled, which a
      # placeholder would not. It costs a sparse clone of one directory
      # (measured at about 8 seconds) and needs nothing but git.
      #
      # A failure is reported, not tolerated. The archive is part of what
      # ships, and a CI run that could not assemble it is telling you something
      # a later publish would otherwise discover.
      - run: pnpm run fetch-examples
      # The build comes BEFORE the typecheck, and that order is required rather
      # than incidental.
      #
      # A package that imports another workspace package names a bare module
      # (`@huaweidevtools/aishell-dsh-credentials-store`), which Node resolves
      # through that package's `types`/`exports` fields — both of which point
      # into `lib/`. Nothing writes `lib/` but tsdown, and `.gitignore` excludes
      # it, so on a clean checkout the typecheck has no declarations to resolve
      # against and fails with TS2307 across every dependent package. `tsc -b`
      # does emit `lib/types/`, but the module specifier never looks there.
      #
      # Building first puts those declarations where the manifests point.
      # Running `build` before `typecheck` is the arrangement that holds on a
      # fresh clone; any other order only passes because a previous build left
      # files behind.
      - run: pnpm run build
      # Two parts. `tsc -b` builds the shipped sources; `typecheck:tests` then
      # checks `src` and `tests` together through each package's
      # `tsconfig.test.json`. The second part is required because `tsc -b`
      # reads only the root tsconfig's `references`, whose projects all
      # `include: ["src"]` — so without it no test file is typechecked at all,
      # and vitest strips types without checking them.
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      # Fails when the generated cordis.patch.yml or the aggregate package.json
      # no longer matches aggregate.yml, which a hand-edit or a renamed package
      # would otherwise leave silently stale in the published tarball.
      - run: node scripts/aggregate.mjs --check
      # Asserts the types and files each manifest promises are actually in the
      # tarball. `pnpm pack` needs no registry and no token, so this is the one
      # place a broken `files`/`exports`/`types` combination is caught before
      # publish rather than by the first consumer.
      - run: node scripts/check-packages.mjs
