# aishell-credentials bundle patch: inserts the credentials management plugin.
# Install standalone: `dsh plugin --profile <name> add link:<repo>/packages/aishell-credentials`
# The single row mounts BOTH halves: the host side (volatile Config secret
# fields + credential-store transfer) and the browser side (the modules node
# half scans dsh.client into the web plugin roster, served from this
# package's lib/client.js).
- insert:
    - id: aishell-client-credentials
      name: '@huaweidevtools/aishell-dsh-client-credentials'
