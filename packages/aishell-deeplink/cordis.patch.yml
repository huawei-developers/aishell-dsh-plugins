# aishell-deeplink bundle patch: mounts the deep-link transport.
#
# The single row mounts BOTH halves: the Host half provides `deepLinks` and
# serves the stream route (`/api/aishell/deep-link`); the modules node half
# scans `dsh.client` into the web plugin roster and serves this package's
# `lib/client.js`, whose half provides `aishellDeepLinks` and dispatches to the
# plugins that claim a link family.
#
# The desktop shell delivers URLs by calling `ctx.deepLinks.deliver(raw)`. It
# does not parse them: families are claimed in the Page, which the Host cannot
# see, so filtering there would drop links the Page would have accepted.
- insert:
    - id: aishell-deeplink
      name: '@huaweidevtools/aishell-dsh-deeplink'